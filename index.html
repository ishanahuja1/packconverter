<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PackConvert">
  <title>Packaging Converter</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#080c14',
              surface: '#0f172a',
              card: '#141e33',
              border: '#1e293b',
              cases: '#f59e0b',
              bbl: '#38bdf8',
              pallet: '#10b981'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    /* Remove default focus ring and outline styling */
    input:focus { outline: none; }
    /* Hide clear button in search/text inputs on some webkit engines */
    input::-webkit-search-decoration,
    input::-webkit-search-cancel-button { display: none; }
  </style>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen flex flex-col p-3 sm:p-5 select-none font-sans antialiased">

  <div class="max-w-4xl w-full mx-auto flex-1 flex flex-col justify-between">
    
    <div>
      <!-- Header -->
      <header class="flex items-center justify-between pb-3 border-b border-brand-border/60 mb-3">
        <div class="flex items-center gap-2">
          <span class="text-brand-cases text-lg">⚡</span>
          <div>
            <h1 class="text-sm font-bold tracking-wider uppercase text-slate-200">Packaging Converter</h1>
            <p class="text-[11px] text-slate-400">Cases · Barrels · Pallets</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnCopy" onclick="copyResults()" class="px-3 py-1.5 text-xs font-medium bg-brand-surface border border-brand-border rounded-lg text-slate-300 active:bg-brand-border transition-colors">
            Copy
          </button>
          <button onclick="clearAll()" class="px-3 py-1.5 text-xs font-medium bg-red-950/40 border border-red-900/60 rounded-lg text-red-300 active:bg-red-900/60 transition-colors">
            Clear
          </button>
        </div>
      </header>

      <!-- Specification Selector Card -->
      <section class="bg-brand-card/90 border border-brand-border rounded-xl p-3.5 mb-3 shadow-lg">
        <div class="flex justify-between items-center mb-2">
          <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">Packaging Specification</span>
          <span id="specBadge" class="text-[10px] font-mono text-brand-bbl">13.78 cs/bbl • 84 cs/plt</span>
        </div>

        <select id="specSelect" onchange="handleSpecChange()" class="w-full bg-brand-surface border border-brand-border rounded-lg px-3 py-2 text-xs font-semibold text-slate-200 focus:border-brand-bbl transition-colors">
          <option value="12oz">24 / 12 oz Cans or Bottles (13.78 cs/bbl • 84 cs/plt)</option>
          <option value="16oz">24 / 16 oz Cans (10.33 cs/bbl • 65 cs/plt)</option>
          <option value="fridge">12 / 12 oz Fridge Packs (27.56 cs/bbl • 140 cs/plt)</option>
          <option value="custom">Custom Specification...</option>
        </select>

        <!-- Custom Inputs Drawer -->
        <div id="customDrawer" class="hidden grid grid-cols-2 gap-2.5 mt-3 pt-3 border-t border-brand-border/60">
          <div>
            <label class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Cases / Barrel</label>
            <input type="text" inputmode="decimal" id="customBblInput" value="13.78" oninput="handleCustomChange()" class="w-full bg-brand-surface border border-brand-border rounded-lg px-2.5 py-1.5 text-xs font-mono text-slate-100">
          </div>
          <div>
            <label class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Cases / Pallet</label>
            <input type="text" inputmode="decimal" id="customPltInput" value="84" oninput="handleCustomChange()" class="w-full bg-brand-surface border border-brand-border rounded-lg px-2.5 py-1.5 text-xs font-mono text-slate-100">
          </div>
        </div>
      </section>

      <!-- Conversion Cards Grid (1 col on cover screen, 3 cols unfolded) -->
      <main class="grid grid-cols-1 md:grid-cols-3 gap-3">
        
        <!-- Cases Card -->
        <div class="bg-brand-card/90 border border-brand-border focus-within:border-brand-cases rounded-xl p-3.5 shadow-lg transition-colors flex flex-col justify-between">
          <div class="flex justify-between items-center mb-1">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-brand-cases"></span>
              <span class="text-xs font-bold tracking-wider text-brand-cases uppercase">Cases</span>
            </div>
            <span class="text-[10px] text-slate-400 font-medium">Packaged Units</span>
          </div>
          <div class="flex items-baseline justify-between gap-2 mt-1">
            <input type="text" inputmode="decimal" id="valCases" placeholder="0" 
                   oninput="calcFromCases()" onfocus="handleFocus(this)" onblur="handleBlur(this, 1)"
                   class="w-full bg-transparent font-mono text-3xl font-bold text-slate-100 placeholder-slate-600">
            <span class="font-mono text-xs font-semibold text-brand-cases/80">cs</span>
          </div>
        </div>

        <!-- Barrels Card -->
        <div class="bg-brand-card/90 border border-brand-border focus-within:border-brand-bbl rounded-xl p-3.5 shadow-lg transition-colors flex flex-col justify-between">
          <div class="flex justify-between items-center mb-1">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-brand-bbl"></span>
              <span class="text-xs font-bold tracking-wider text-brand-bbl uppercase">Barrels (BBL)</span>
            </div>
            <span class="text-[10px] text-slate-400 font-medium">31 US Gal / bbl</span>
          </div>
          <div class="flex items-baseline justify-between gap-2 mt-1">
            <input type="text" inputmode="decimal" id="valBbl" placeholder="0.00" 
                   oninput="calcFromBbl()" onfocus="handleFocus(this)" onblur="handleBlur(this, 2)"
                   class="w-full bg-transparent font-mono text-3xl font-bold text-slate-100 placeholder-slate-600">
            <span class="font-mono text-xs font-semibold text-brand-bbl/80">bbl</span>
          </div>
        </div>

        <!-- Pallets Card -->
        <div class="bg-brand-card/90 border border-brand-border focus-within:border-brand-pallet rounded-xl p-3.5 shadow-lg transition-colors flex flex-col justify-between">
          <div class="flex justify-between items-center mb-1">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-brand-pallet"></span>
              <span class="text-xs font-bold tracking-wider text-brand-pallet uppercase">Pallets</span>
            </div>
            <span id="pltCardSubtext" class="text-[10px] text-slate-400 font-medium font-mono">@ 84 cs/plt</span>
          </div>
          <div class="flex items-baseline justify-between gap-2 mt-1">
            <input type="text" inputmode="decimal" id="valPallets" placeholder="0.00" 
                   oninput="calcFromPallets()" onfocus="handleFocus(this)" onblur="handleBlur(this, 2)"
                   class="w-full bg-transparent font-mono text-3xl font-bold text-slate-100 placeholder-slate-600">
            <span class="font-mono text-xs font-semibold text-brand-pallet/80">plt</span>
          </div>
        </div>

      </main>
    </div>

    <!-- Bottom Tip -->
    <footer class="text-center py-4">
      <p class="text-[11px] text-slate-500 font-medium">Tip: Works completely offline on outer cover screen or unfolded display.</p>
    </footer>

  </div>

  <script>
    let csPerBbl = 13.78;
    let csPerPlt = 84;

    const inCases = document.getElementById('valCases');
    const inBbl = document.getElementById('valBbl');
    const inPlt = document.getElementById('valPallets');
    const specBadge = document.getElementById('specBadge');
    const pltCardSubtext = document.getElementById('pltCardSubtext');
    const specSelect = document.getElementById('specSelect');
    const customDrawer = document.getElementById('customDrawer');
    const customBblInput = document.getElementById('customBblInput');
    const customPltInput = document.getElementById('customPltInput');
    const btnCopy = document.getElementById('btnCopy');

    // Strip commas and parse raw float
    function parseRaw(val) {
      if (!val) return NaN;
      return parseFloat(val.toString().replace(/,/g, ''));
    }

    // Format number with thousands commas
    function formatWithCommas(num, maxDecimals = 2) {
      if (num === null || num === undefined || isNaN(num) || num === '') return '';
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maxDecimals
      });
    }

    // Live calculations: other fields update with commas immediately
    function calcFromCases() {
      const c = parseRaw(inCases.value);
      if (isNaN(c) || inCases.value.trim() === '') {
        inBbl.value = '';
        inPlt.value = '';
        return;
      }
      inBbl.value = formatWithCommas(c / csPerBbl, 2);
      inPlt.value = formatWithCommas(c / csPerPlt, 2);
    }

    function calcFromBbl() {
      const b = parseRaw(inBbl.value);
      if (isNaN(b) || inBbl.value.trim() === '') {
        inCases.value = '';
        inPlt.value = '';
        return;
      }
      const c = b * csPerBbl;
      inCases.value = formatWithCommas(c, 1);
      inPlt.value = formatWithCommas(c / csPerPlt, 2);
    }

    function calcFromPallets() {
      const p = parseRaw(inPlt.value);
      if (isNaN(p) || inPlt.value.trim() === '') {
        inCases.value = '';
        inBbl.value = '';
        return;
      }
      const c = p * csPerPlt;
      inCases.value = formatWithCommas(c, 1);
      inBbl.value = formatWithCommas(c / csPerBbl, 2);
    }

    // Format the active field when tapping away
    function handleBlur(input, maxDecimals) {
      const raw = parseRaw(input.value);
      if (!isNaN(raw) && input.value.trim() !== '') {
        input.value = formatWithCommas(raw, maxDecimals);
      }
    }

    // Select text on tap for effortless overwrite/editing
    function handleFocus(input) {
      setTimeout(() => input.select(), 50);
    }

    // Specification handling
    function handleSpecChange() {
      const val = specSelect.value;
      if (val === '12oz') {
        csPerBbl = 13.78;
        csPerPlt = 84;
        customDrawer.classList.add('hidden');
      } else if (val === '16oz') {
        csPerBbl = 10.33;
        csPerPlt = 65;
        customDrawer.classList.add('hidden');
      } else if (val === 'fridge') {
        csPerBbl = 27.56;
        csPerPlt = 140;
        customDrawer.classList.add('hidden');
      } else if (val === 'custom') {
        customDrawer.classList.remove('hidden');
        handleCustomChange();
        return;
      }
      updateLabels();
      recalculate();
    }

    function handleCustomChange() {
      const bbl = parseRaw(customBblInput.value);
      const plt = parseRaw(customPltInput.value);
      if (!isNaN(bbl) && bbl > 0) csPerBbl = bbl;
      if (!isNaN(plt) && plt > 0) csPerPlt = plt;
      updateLabels();
      recalculate();
    }

    function updateLabels() {
      specBadge.textContent = `${csPerBbl} cs/bbl • ${csPerPlt} cs/plt`;
      pltCardSubtext.textContent = `@ ${csPerPlt} cs/plt`;
    }

    function recalculate() {
      if (document.activeElement === inBbl) calcFromBbl();
      else if (document.activeElement === inPlt) calcFromPallets();
      else calcFromCases();
    }

    function clearAll() {
      inCases.value = '';
      inBbl.value = '';
      inPlt.value = '';
      inCases.focus();
    }

    function copyResults() {
      const c = inCases.value || '0';
      const b = inBbl.value || '0';
      const p = inPlt.value || '0';
      const text = `${c} cs = ${b} bbl = ${p} plt (${specSelect.options[specSelect.selectedIndex].text.split('(')[0].trim()})`;
      navigator.clipboard.writeText(text).then(() => {
        btnCopy.textContent = 'Copied!';
        setTimeout(() => btnCopy.textContent = 'Copy', 1500);
      });
    }
  </script>
</body>
</html>
